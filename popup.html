<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp-Web-Plus Extension</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="container">
    <header class="header">
        <h1>WhatsApp-Web-Plus</h1>
        <p class="tagline">Enhance your WhatsApp experience</p>
    </header>

    <main class="content">
        <p>Unlock premium features and take your WhatsApp to the next level!</p>
        <br>
        <!-- Settings Section -->
        <div class="settings-container" id="settings_section">
            <h1>Settings</h1>
            <br>
            <!-- Email Configuration -->
            <div class="setting-item" style="margin-bottom: 15px;">
                <label for="notification_email" style="display: block; margin-bottom: 5px;">Notification Email:</label>
                <input type="email" id="notification_email" placeholder="Enter email for notifications" 
                    style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2024 WhatsApp-Web-Plus</p>
    </footer>
</div>
<script src="popup.js"></script>
</body>
</html>
